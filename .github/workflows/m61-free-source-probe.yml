name: M61 no-cost market-source probe

on:
  push:
    branches:
      - m61/live-free-source-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe public market endpoint without preserving price data
        shell: bash
        run: |
          set +e
          python -m tools.m61_free_market_probe --output-dir "$RUNNER_TEMP/m61-free-probe"
          probe_status=$?
          echo "----- M61 FREE SOURCE REPORT (METADATA ONLY) -----"
          cat "$RUNNER_TEMP/m61-free-probe/free-market-probe-report.json"
          echo "probe_exit_code=$probe_status"
          # A source probe is evidence collection, not a CI pass/fail test.
          # The JSON report explicitly records source failures and acceptance gaps.
          exit 0
