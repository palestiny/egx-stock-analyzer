name: M61 Yahoo ticker variant probe

on:
  push:
    branches: [m61/yahoo-symbol-variant-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-symbol-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe COMI ticker variants without retaining prices
        run: python -m tools.m61_yahoo_symbol_variant_probe | tee yahoo-variant-report.json
      - name: Upload metadata-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m61-yahoo-variant-report
          path: yahoo-variant-report.json
          if-no-files-found: warn
          retention-days: 7
