name: M61 EGID live contract probe

on:
  push:
    branches:
      - m61/egid-live-contract-probe
    paths:
      - ".github/workflows/m61-egid-live-contract-probe.yml"
      - "tools/m61_egid_contract_probe.py"
      - "tools/m61_egid_access_probe.py"
      - "tools/m61_free_market_probe.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-public-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect public EGID OpenAPI contract only
        env:
          PYTHONPATH: .
        run: python -m tools.m61_egid_contract_probe
      - name: Check one bounded history request without credentials
        env:
          PYTHONPATH: .
        run: python -m tools.m61_egid_access_probe

      - name: Probe Yahoo candidate coverage without preserving source responses
        env:
          PYTHONPATH: .
        run: |
          set +e
          python -m tools.m61_free_market_probe --output-dir /tmp/m61-free-probe
          probe_exit=$?
          set -e
          echo "Yahoo probe process exit code: $probe_exit"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/m61-free-probe/free-market-probe-report.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "status": report["status"],
              "eligible_for_strategy_v0": report["eligible_for_strategy_v0"],
              "symbols": [{
                  "symbol": item["symbol"],
                  "http_status": item["status_code"],
                  "row_count": item["observed"]["row_count"],
                  "first_date": item["observed"]["first_date"],
                  "last_date": item["observed"]["last_date"],
                  "finding_count": len(item["observed"]["validation_findings"]),
                  "finding_examples": item["observed"]["validation_findings"][:5],
                  "ohlc_integrity_summary": item["observed"]["ohlc_integrity_summary"],
                  "source_terms_verified": item["acceptance"]["source_terms_verified"],
              } for item in report["symbols"]],
          }, indent=2, sort_keys=True))
          PY
