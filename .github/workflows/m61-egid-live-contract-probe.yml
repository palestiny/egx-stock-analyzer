name: M61 EGID live contract probe

on:
  push:
    branches:
      - m61/egid-live-contract-probe
    paths:
      - ".github/workflows/m61-egid-live-contract-probe.yml"
      - "tools/m61_egid_contract_probe.py"
      - "tools/m61_egid_access_probe.py"
      - "tools/m61_free_market_probe.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-public-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect public EGID OpenAPI contract only
        env:
          PYTHONPATH: .
        run: python -m tools.m61_egid_contract_probe
      - name: Check one bounded history request without credentials
        env:
          PYTHONPATH: .
        run: python -m tools.m61_egid_access_probe

      - name: Probe Yahoo candidate coverage without preserving source responses
        env:
          PYTHONPATH: .
        run: |
          set +e
          python -m tools.m61_free_market_probe --output-dir /tmp/m61-free-probe
          probe_exit=$?
          set -e
          echo "Yahoo probe process exit code: $probe_exit"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/m61-free-probe/free-market-probe-report.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "status": report["status"],
              "eligible_for_strategy_v0": report["eligible_for_strategy_v0"],
              "symbols": [{
                  "symbol": item["symbol"],
                  "http_status": item["status_code"],
                  "row_count": item["observed"]["row_count"],
                  "first_date": item["observed"]["first_date"],
                  "last_date": item["observed"]["last_date"],
                  "finding_count": len(item["observed"]["validation_findings"]),
                  "finding_examples": item["observed"]["validation_findings"][:5],
                  "ohlc_integrity_summary": item["observed"]["ohlc_integrity_summary"],
                  "source_terms_verified": item["acceptance"]["source_terms_verified"],
              } for item in report["symbols"]],
          }, indent=2, sort_keys=True))
          PY

      - name: Install free TradeGlob diagnostic client
        run: python -m pip install --upgrade pip && pip install requests git+https://github.com/ibrasonic/TradeGlob.git
      - name: Cross-check COMI OHLC consistency without saving data
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from datetime import date
          from tradeglob import TradeGlobFetcher

          fetcher = TradeGlobFetcher()
          frame = fetcher.get_ohlcv(
              symbol="COMI",
              exchange="EGX",
              interval="Daily",
              n_bars=5000,
              use_cache=False,
              validate=True,
          )
          if frame is None or frame.empty:
              print(json.dumps({"provider": "TradeGlob/TradingView", "status": "EMPTY"}))
              raise SystemExit(0)

          dates = pd.to_datetime(frame.index, errors="coerce")
          if getattr(dates, "tz", None) is not None:
              dates = dates.tz_convert("Africa/Cairo").tz_localize(None)
          mask = (dates.date >= date(2019, 1, 1)) & (dates.date <= date(2025, 12, 31))
          frame = frame.loc[mask].copy()
          dates = dates[mask]
          columns = {str(column).lower().replace(" ", "_"): column for column in frame.columns}
          required = ["open", "high", "low", "close"]
          if not all(name in columns for name in required):
              print(json.dumps({
                  "provider": "TradeGlob/TradingView",
                  "status": "SCHEMA_MISMATCH",
                  "columns": [str(column) for column in frame.columns],
                  "rows": int(len(frame)),
              }))
              raise SystemExit(0)

          values = {name: pd.to_numeric(frame[columns[name]], errors="coerce") for name in required}
          valid = pd.concat(values, axis=1).dropna()
          summary = {
              "provider": "TradeGlob/TradingView",
              "status": "CANDIDATE_ONLY",
              "symbol": "COMI",
              "rows_in_2019_2025": int(len(frame)),
              "first_date": str(dates.min().date()) if len(dates) else None,
              "last_date": str(dates.max().date()) if len(dates) else None,
              "rows_with_missing_or_non_numeric_ohlc": int(len(frame) - len(valid)),
              "low_above_open": int((valid["low"] > valid["open"]).sum()),
              "low_above_close": int((valid["low"] > valid["close"]).sum()),
              "high_below_open": int((valid["high"] < valid["open"]).sum()),
              "high_below_close": int((valid["high"] < valid["close"]).sum()),
              "low_above_high": int((valid["low"] > valid["high"]).sum()),
              "raw_values_persisted": False,
              "source_terms_verified": False,
              "dataset_accepted": False,
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
