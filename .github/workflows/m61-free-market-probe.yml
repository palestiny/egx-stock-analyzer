name: M61 bounded no-cost data probe

on:
  push:
    branches: [test/m61-synthetic-e2e-run]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Probe the fixed ten-symbol cohort without retaining prices
        continue-on-error: true
        run: python -m tools.m61_free_market_probe --output-dir ./artifacts/m61-free-probe
      - name: Upload metadata-only source findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m61-free-market-probe-report
          path: artifacts/m61-free-probe/free-market-probe-report.json
          if-no-files-found: warn
          retention-days: 7
