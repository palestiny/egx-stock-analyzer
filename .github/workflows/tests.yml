name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    env:
      EGX_OPERATOR_TOKEN: test-operator-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run lint
        run: ruff check app tests
      - name: Type-check hardened primitives
        run: mypy app/api/auth_rate_limit.py app/application/security/credentials.py app/api/market_intelligence_routes.py app/api/user_management_routes.py app/api/scheduled_workflow_routes.py --ignore-missing-imports --follow-imports=silent
      - name: Run unit tests with coverage report
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85 -m "not integration"

  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    env:
      EGX_OPERATOR_TOKEN: test-operator-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run deterministic integration tests
        run: pytest -m "integration and not external"

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:run
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and audit tool
        run: python -m pip install --upgrade pip && pip install -e . pip-audit
      - name: Audit installed dependencies
        run: pip-audit

  container-build:
    runs-on: ubuntu-latest
    env:
      EGX_OPERATOR_TOKEN: ci-only-placeholder-token
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build API image
        run: docker build --file Dockerfile --tag egx-stock-analyzer-api:ci .
      - name: Build frontend image
        run: docker build --file frontend/Dockerfile --tag egx-stock-analyzer-frontend:ci .
      - name: Validate Nginx configuration on the Compose network
        run: |
          docker compose up -d --wait api
          docker compose run --rm frontend nginx -t
          docker compose down -v
