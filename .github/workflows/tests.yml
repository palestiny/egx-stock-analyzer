name: Tests

on:
  # Main pushes are checked directly. Feature branches are checked by their PR
  # workflow, avoiding duplicate push + pull_request runs that cancel each other.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    env:
      EGX_OPERATOR_TOKEN: test-operator-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run lint
        run: ruff check app tests
      - name: Type-check application package
        run: mypy app --ignore-missing-imports --follow-imports=silent
      - name: Run unit tests with coverage report
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85 -m "not integration"

  integration-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    env:
      EGX_OPERATOR_TOKEN: test-operator-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run deterministic integration tests
        run: pytest -m "integration and not external"

  frontend-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:run
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  dependency-audit:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and audit tool
        run: python -m pip install --upgrade pip && pip install -e . pip-audit
      - name: Audit installed dependencies
        run: pip-audit

  container-build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      EGX_OPERATOR_TOKEN: ci-only-placeholder-token
      EGX_DOMAIN: example.com
      ACME_EMAIL: ops@example.com
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose --file compose.yaml --file compose.production.yaml config --quiet
      - name: Validate production Caddyfile
        run: docker run --rm -e EGX_DOMAIN=example.com -e ACME_EMAIL=ops@example.com -v "${{ github.workspace }}/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build API image
        run: docker build --file Dockerfile --tag egx-stock-analyzer-api:ci .
      - name: Build frontend image
        run: docker build --file frontend/Dockerfile --tag egx-stock-analyzer-frontend:ci .
      - name: Validate Nginx configuration on the Compose network
        run: |
          timeout 90s docker compose up -d --wait api || { docker compose logs api; exit 1; }
          timeout 30s docker compose run --rm --no-deps frontend nginx -t
          docker compose down -v
      - name: Clean up Compose services
        if: always()
        run: docker compose down -v

  daily-history-audit-report:
    timeout-minutes: 10
    name: daily-history-audit-report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run read-only daily history audit
        id: audit
        shell: bash
        run: |
          set +e
          python -m tools.egx_daily_history_audit \
            --input data/market_history/egx_daily_history.csv \
            --output reports/egx-daily-history-audit.json
          audit_exit_code=$?
          set -e

          if [ "$audit_exit_code" -gt 1 ]; then
            echo "Audit CLI failed with exit code $audit_exit_code"
            exit "$audit_exit_code"
          fi

          python -c "import json; from pathlib import Path; report=json.loads(Path('reports/egx-daily-history-audit.json').read_text(encoding='utf-8')); assert report.get('status') in {'clean', 'completed_with_findings'}; print('Audit status:', report['status']); print('Rows:', report.get('row_count', 'unknown')); print('SHA-256:', report['artifact']['sha256'])"
          echo "Audit CLI exit code: $audit_exit_code" >> "$GITHUB_STEP_SUMMARY"
          echo "Audit report status: $(python -c "import json; print(json.load(open('reports/egx-daily-history-audit.json', encoding='utf-8'))['status'])")" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload daily history audit report
        uses: actions/upload-artifact@v4
        with:
          name: egx-daily-history-audit-${{ github.sha }}
          path: reports/egx-daily-history-audit.json
          if-no-files-found: error
          retention-days: 14

  lifecycle-projection-benchmark:
    name: On-disk lifecycle projection benchmark
    if: github.event_name == 'pull_request'
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Run synthetic on-disk SQLite benchmark
        run: |
          mkdir -p reports
          python -m tools.benchmark_lifecycle_projection \\
            --sizes 10000 50000 100000 \\
            --samples 7 \\
            --warmups 2 \\
            --writer-operations 250 \\
            --output reports/lifecycle-projection-benchmark.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-projection-benchmark-${{ github.sha }}
          path: reports/lifecycle-projection-benchmark.json
          if-no-files-found: error
          retention-days: 30
