name: Lifecycle Projection Benchmark

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: "Synthetic opportunity identity counts"
        required: true
        default: "10000 50000 100000"
        type: string
      samples:
        description: "Warm and writer-pressure timing samples"
        required: true
        default: "7"
        type: string
      warmups:
        description: "Warm-up queries per size"
        required: true
        default: "2"
        type: string
      writer_operations:
        description: "Synthetic append operations during concurrent reads"
        required: true
        default: "250"
        type: string

permissions:
  contents: read

concurrency:
  group: lifecycle-projection-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: On-disk SQLite projection benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Validate benchmark inputs
        env:
          SIZES: ${{ inputs.sizes }}
          SAMPLES: ${{ inputs.samples }}
          WARMUPS: ${{ inputs.warmups }}
          WRITER_OPERATIONS: ${{ inputs.writer_operations }}
        run: |
          python - <<'PY'
          import os
          sizes = [int(value) for value in os.environ["SIZES"].split()]
          samples = int(os.environ["SAMPLES"])
          warmups = int(os.environ["WARMUPS"])
          writer_operations = int(os.environ["WRITER_OPERATIONS"])
          if not sizes or any(value < 2 or value > 100000 for value in sizes):
              raise SystemExit("sizes must be between 2 and 100000")
          if samples < 2 or samples > 30:
              raise SystemExit("samples must be between 2 and 30")
          if warmups < 0 or warmups > 20:
              raise SystemExit("warmups must be between 0 and 20")
          if writer_operations < 0 or writer_operations > 5000:
              raise SystemExit("writer_operations must be between 0 and 5000")
          PY
      - name: Run synthetic on-disk benchmark
        env:
          SIZES: ${{ inputs.sizes }}
          SAMPLES: ${{ inputs.samples }}
          WARMUPS: ${{ inputs.warmups }}
          WRITER_OPERATIONS: ${{ inputs.writer_operations }}
        run: |
          mkdir -p reports
          python -m tools.benchmark_lifecycle_projection \
            --sizes $SIZES \
            --samples "$SAMPLES" \
            --warmups "$WARMUPS" \
            --writer-operations "$WRITER_OPERATIONS" \
            --output reports/lifecycle-projection-benchmark.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-projection-benchmark-${{ github.sha }}
          path: reports/lifecycle-projection-benchmark.json
          if-no-files-found: error
          retention-days: 30
