name: M61 public COMI diagnostic backtest

on:
  push:
    branches:
      - test/m61-public-comi-sample-backtest
  pull_request:
    paths:
      - "tools/m61_public_comi_sample_backtest.py"
      - "tests/m61/test_public_comi_sample_backtest.py"
      - "tests/fixtures/m61_public_comi_history_2019_2023.csv"
      - "docs/M61-PUBLIC-COMI-SAMPLE-DIAGNOSTIC.md"
      - ".github/workflows/m61-public-comi-sample.yml"

permissions:
  contents: read

jobs:
  diagnostic-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run diagnostic backtest and print metrics
        run: python -m tools.m61_public_comi_sample_backtest
      - name: Verify deterministic result
        run: python -m pytest tests/m61/test_public_comi_sample_backtest.py -q
