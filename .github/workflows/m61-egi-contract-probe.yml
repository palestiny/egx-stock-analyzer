name: M61 EGID public contract probe

on:
  push:
    branches:
      - m61/egi-contract-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect public Swagger contract only
        shell: bash
        run: |
          python -m tools.m61_egid_contract_probe --output "$RUNNER_TEMP/egid-contract.json"
          cat "$RUNNER_TEMP/egid-contract.json"
