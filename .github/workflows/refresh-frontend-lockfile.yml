name: Refresh frontend lockfile

on:
  push:
    branches: [feature/crash-radar-evidence-transparency]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/crash-radar-evidence-transparency
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh and verify frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit fix
          npm audit --audit-level=high
          npm run lint
          npm run test:run
          npm run build
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git rm .github/workflows/refresh-frontend-lockfile.yml
          git commit -m "fix: update vulnerable frontend dependencies"
          git push origin HEAD:feature/crash-radar-evidence-transparency
