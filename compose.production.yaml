services:
  caddy:
    image: caddy:2-alpine
    depends_on:
      - frontend
    environment:
      EGX_DOMAIN: ${EGX_DOMAIN:?Set EGX_DOMAIN to a public DNS name}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for certificate notifications}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.30.0.2

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy-data:
  caddy-config:
