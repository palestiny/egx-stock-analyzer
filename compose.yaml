services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      EGX_ANALYSIS_DATABASE_PATH: /data/analysis.db
      EGX_OPERATOR_TOKEN: ${EGX_OPERATOR_TOKEN:?Set EGX_OPERATOR_TOKEN before starting}
      EGX_CORS_ALLOWED_ORIGINS: ${EGX_CORS_ALLOWED_ORIGINS:-}
      EGX_TRUST_PROXY_HEADERS: "true"
    volumes:
      - egx-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EGX_HTTP_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  egx-data:
