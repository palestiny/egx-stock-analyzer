[project]
name = "egx-stock-analyzer"
version = "0.1.0"
description = "An automated analysis system for Egyptian Exchange stocks"
requires-python = ">=3.13"
dependencies = [
    "yfinance>=0.2.66,<0.3",
    "fastapi>=0.141.1,<0.142",
    "uvicorn>=0.35,<0.36",
    "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that exercise the application with external infrastructure",
]
