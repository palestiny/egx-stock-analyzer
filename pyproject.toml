[project]
name = "egx-stock-analyzer"
version = "0.1.0"
description = "An automated analysis system for Egyptian Exchange stocks"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.66,<0.3",
    "fastapi>=0.141.1,<0.142",
    "uvicorn>=0.35,<0.36",
    "httpx>=0.28,<0.29",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1.0",
    "mypy>=1.15,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that exercise the application with external infrastructure",
    "external: tests that require live third-party or provider credentials/access",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "DTZ", "F401"]
ignore = ["E402", "E701"]
per-file-ignores = { "tests/**" = ["DTZ001"], "**/__init__.py" = ["F401"] }
